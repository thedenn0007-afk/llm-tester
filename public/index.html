<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Capability Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="pill">Multi-provider + Groq capability suite</div>
        <h1>LLM Playground</h1>
        <p>Switch providers quickly. Groq unlocks capability tabs, media tools, and artifact downloads.</p>
      </header>

      <section class="toolbar card">
        <div class="controls">
          <label>
            Provider
            <select id="provider"></select>
          </label>
          <label>
            Model
            <select id="model"></select>
          </label>
          <label>
            Temperature
            <input id="temperature" type="number" step="0.1" min="0" max="2" value="0.7" />
          </label>
        </div>
      </section>

      <section id="groq-area" class="card hidden">
        <h2>Groq Capabilities</h2>
        <div id="capability-tabs" class="tabs"></div>
      </section>

      <section id="chat" class="chat card"></section>

      <section id="text-panel" class="card">
        <form id="chat-form" class="stack">
          <label>
            Prompt
            <textarea id="prompt" placeholder="Type your prompt..." rows="4" required></textarea>
          </label>

          <div id="tool-box" class="subcard hidden">
            <div class="subhead">Preset Tools</div>
            <label class="inline"><input type="checkbox" value="get_weather" checked /> Weather</label>
            <label class="inline"><input type="checkbox" value="calculate_math" checked /> Math</label>
            <label class="inline"><input type="checkbox" value="search_docs" checked /> Search</label>
          </div>

          <div id="vision-box" class="subcard hidden">
            <div class="subhead">Vision Input</div>
            <input id="vision-image" type="file" accept="image/*" />
            <img id="vision-preview" class="preview hidden" alt="Vision preview" />
          </div>

          <div class="actions">
            <button id="send" type="submit">Send</button>
            <button id="clear" type="button" class="ghost">Clear</button>
            <button id="retry" type="button" class="ghost">Retry Last</button>
          </div>
        </form>
      </section>

      <section id="stt-panel" class="card hidden">
        <h2>Speech to Text</h2>
        <form id="stt-form" class="stack">
          <label>
            Audio File
            <input id="stt-file" type="file" accept="audio/*" required />
          </label>
          <label>
            Language (optional)
            <input id="stt-language" type="text" placeholder="en" />
          </label>
          <label>
            Prompt (optional)
            <input id="stt-prompt" type="text" placeholder="Transcribe clearly" />
          </label>
          <div class="actions">
            <button type="submit">Transcribe</button>
            <button id="stt-retry" type="button" class="ghost">Retry Last</button>
          </div>
        </form>
      </section>

      <section id="tts-panel" class="card hidden">
        <h2>Text to Speech</h2>
        <form id="tts-form" class="stack">
          <label>
            Text Input
            <textarea id="tts-input" rows="4" placeholder="Type text to synthesize"></textarea>
          </label>
          <label>
            Voice
            <select id="tts-voice"></select>
          </label>
          <div class="actions">
            <button type="submit">Generate Audio</button>
            <button id="tts-retry" type="button" class="ghost">Retry Last</button>
          </div>
        </form>
        <audio id="tts-audio" controls class="hidden"></audio>
      </section>

      <section class="card">
        <h2>Latest Artifacts</h2>
        <div class="actions left">
          <button id="download-text" type="button" class="ghost" disabled>Download .txt</button>
          <button id="download-json" type="button" class="ghost" disabled>Download .json</button>
          <button id="download-audio" type="button" class="ghost" disabled>Download audio</button>
          <button id="download-image" type="button" class="ghost" disabled>Download image</button>
          <button id="copy-text" type="button" class="ghost" disabled>Copy text</button>
          <button id="copy-json" type="button" class="ghost" disabled>Copy json</button>
        </div>
      </section>

      <section class="card">
        <h2>Debug + Metrics</h2>
        <div id="metrics" class="meta">No runs yet.</div>
        <label>
          Last Request
          <textarea id="debug-request" class="mono" rows="6" readonly></textarea>
        </label>
        <label>
          Last Response
          <textarea id="debug-response" class="mono" rows="8" readonly></textarea>
        </label>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
